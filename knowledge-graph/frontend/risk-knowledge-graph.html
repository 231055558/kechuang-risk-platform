<body><main class="app">
  <header><div><h1>金融事件演化风险知识大图</h1><p>实体、事件与风险三级关联；演化边均由历史事件计算并保留评分依据。</p></div><div class="status" id="status">正在连接本地服务...</div></header>
  <section class="controls" aria-label="图谱控制"><label>企业<select id="company"><option>加载中...</option></select></label><label>最小影响权重<select id="impactThreshold"><option value="0.75">核心主体 ≥ 0.75</option><option value="0.50" selected>重要主体 ≥ 0.50</option><option value="0.35">扩展主体 ≥ 0.35</option></select></label><label>节点类型<select id="typeFilter"><option value="">全部风险节点</option></select></label><label>搜索<input id="search" placeholder="风险源、事件或指标"></label><div class="toggle-set" aria-label="扩展显示"><label><input id="showEvidence" type="checkbox">证据来源</label><input id="showEvolution" type="checkbox" checked hidden></div><button id="overview" class="secondary" type="button">返回传导图</button><button id="reload" type="button">刷新数据</button></section>

  <input id="showInference" type="checkbox" hidden><input id="showReview" type="checkbox" hidden>
